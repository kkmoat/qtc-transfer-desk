[package]
name = "quantus-browser-crypto"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Browser-local Quantus account derivation and runtime-152 signing using official primitives"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wormhole-prover = ["dep:qp-wormhole-prover", "dep:qp-wormhole-aggregator", "dep:qp-wormhole-circuit", "dep:qp-zk-circuits-common", "dep:qp-plonky2", "dep:getrandom", "dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
qp-rusty-crystals-dilithium = { version = "=4.1.1", default-features = false, features = ["ml-dsa-65", "ml-dsa-87"] }
qp-rusty-crystals-hdwallet = { version = "=4.1.1", default-features = false, features = ["ml-dsa-65", "ml-dsa-87"] }
qp-poseidon-core = { version = "=3.1.0", default-features = false }
wasm-bindgen = "=0.2.114"
zeroize = { version = "=1.8.2", features = ["alloc"] }
blake2 = "=0.10.6"
bs58 = "=0.5.1"
qp-wormhole-prover = { version = "=4.3.0", default-features = false, features = ["std"], optional = true }
qp-wormhole-aggregator = { version = "=4.3.0", default-features = false, features = ["std"], optional = true }
qp-wormhole-circuit = { version = "=4.3.0", default-features = false, features = ["std"], optional = true }
qp-zk-circuits-common = { version = "=4.3.0", default-features = false, features = ["std"], optional = true }
qp-plonky2 = { version = "=1.5.5", default-features = false, features = ["std", "rand", "getrandom"], optional = true }
getrandom = { version = "=0.2.17", features = ["js"], optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.150", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
