name: Source and static build checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_deployment:
        description: Compare the public production deployment with this commit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:crypto
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Verify public deployment (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_deployment
        run: node scripts/verify-deployment.mjs
